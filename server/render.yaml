services:
  - type: web
    name: sm-payroll-system
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://sm-payroll-system.vercel.app
      # ─────────────────────────────────────────────────────────────────────────
      # DATABASE_URL: Set this manually in Render Dashboard (never commit it).
      # Use the EXTERNAL Database URL from your Render PostgreSQL instance.
      # Format: postgres://user:pass@dpg-XXXX.oregon-postgres.render.com:5432/db
      #         ↑ Must include full hostname with region (.oregon-postgres.render.com)
      #           and port 5432.
      # ⚠️  Do NOT use the Internal URL (dpg-XXXX-a without region) — it causes:
      #     getaddrinfo ENOTFOUND dpg-XXXX-a
      # ─────────────────────────────────────────────────────────────────────────
      - key: CORS_ALLOW_LAN
        value: false
