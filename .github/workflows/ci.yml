name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Frontend: install + type-check
      - run: npm ci
      - run: npx tsc --noEmit

      # Backend: install + syntax-check
      - run: cd server && npm ci
      - run: node --check server/index.js
